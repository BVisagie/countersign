[package]
name = "countersign-daemon"
description = "Countersign's background service: owns the Bitwarden CLI session, clipboard and locks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "countersignd"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
countersign-bw.workspace = true
countersign-ipc.workspace = true
dirs.workspace = true
futures-util.workspace = true
hex = "0.4"
libc.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }
secrecy.workspace = true
sha2 = "0.11.1"
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
wl-clipboard-rs = "0.9.5"
zbus = { version = "5", default-features = false, features = ["tokio"] }
zeroize.workspace = true
zip = { version = "9.3.0", default-features = false, features = ["deflate"] }

[dev-dependencies]

[lints]
workspace = true
