[package]
name = "countersign"
description = "A fast, keyboard-first Bitwarden app for Omarchy, built on the official Bitwarden CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = ["terminal"]
# Runs the official `bw login` inside the app. Needs the vte4 library.
terminal = ["dep:vte4", "dep:libc"]

[dependencies]
adw.workspace = true
async-channel.workspace = true
countersign-ipc.workspace = true
gtk.workspace = true
gtk4-layer-shell.workspace = true
libc = { workspace = true, optional = true }
ksni = { version = "0.3.7", default-features = false, features = ["blocking", "async-io"] }
nucleo-matcher.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
vte4 = { version = "0.10.0", optional = true, features = ["v0_76"] }
zeroize.workspace = true

[build-dependencies]
glib-build-tools = "0.22.8"

[lints]
workspace = true
