name: Release

# A tag v<version> builds the release archive and drafts a GitHub release
# with it; publishing the draft is done by hand. A pull request that changes
# the packaging builds the archive without releasing it.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/install.sh
      - scripts/package.sh

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    # Built on Arch, like Omarchy, so it links the libraries Omarchy has.
    container: archlinux:latest
    steps:
      - name: Install system packages
        run: pacman -Syu --noconfirm --needed base-devel git gtk4 libadwaita gtk4-layer-shell vte4 rustup
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The container runs as root on a workspace the runner owns; without
      # this, git refuses it, and package.sh needs the commit's time.
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install Rust
        run: rustup default stable && rustup component add clippy rustfmt
      - name: Check the tag matches Cargo.toml
        if: github.ref_type == 'tag'
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          case "$GITHUB_REF_NAME" in
            "v$version" | "v$version"-*) ;;
            *) echo "Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml" >&2; exit 1 ;;
          esac
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: scripts/package.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: countersign-x86_64
          path: dist/
          if-no-files-found: error

  release:
    needs: package
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: countersign-x86_64
          path: dist
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          # The notes are the version's section of CHANGELOG.md.
          awk -v heading="## $version" '$0 == heading { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md >notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no section \"## $version\"" >&2
            exit 1
          fi
          # Then how to install this release, with its own download links.
          repo=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY
          cat >>notes.md <<NOTES

          ## Install

          On Omarchy, on an Intel or AMD (x86_64) computer, in a terminal:

          \`\`\`bash
          mkdir -p ~/Downloads/countersign && cd ~/Downloads/countersign
          curl -LO $repo/releases/download/$GITHUB_REF_NAME/countersign-x86_64.tar.gz
          curl -LO $repo/releases/download/$GITHUB_REF_NAME/SHA256SUMS
          sha256sum -c SHA256SUMS && tar xf countersign-x86_64.tar.gz && countersign-x86_64/scripts/install.sh
          \`\`\`

          \`sha256sum -c\` should say \`countersign-x86_64.tar.gz: OK\`. Then open
          Countersign from your app launcher. [The install guide]($repo/blob/$GITHUB_REF_NAME/docs/INSTALL.md)
          explains each step, how to add a key for quick access, and how to update.
          NOTES
          flags=(--draft --verify-tag --title "Countersign ${GITHUB_REF_NAME#v}" --notes-file notes.md)
          if [[ $GITHUB_REF_NAME == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" dist/countersign-x86_64.tar.gz dist/SHA256SUMS
